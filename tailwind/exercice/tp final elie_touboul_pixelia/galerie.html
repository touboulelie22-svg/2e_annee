<html lang="fr">

    <title>acceil</title>

    <script src="main.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>

            theme: {
                extend: {
                    colors: {
                        colorless: "#2563EB",

<body class="bg-gray-300 dark:bg-gray-900 text-gray-900 dark:text-gray-100">

        <nav class="hidden md:flex flex-col md:flex-row md:space-x-6 text-sm font-medium text-white dark:text-black"

        </nav>

        <button class="bg-gray-200 dark:bg-gray-700 text-black dark:text-white px-4 py-2 rounded" id="theme">

        </button>
        <button id="burger" class="md:hidden text-indigo-600 text-3xl focus:outline-none">
