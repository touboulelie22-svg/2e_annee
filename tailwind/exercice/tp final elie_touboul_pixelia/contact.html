<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>contact</title>

    <script src="main.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        colorless: "#2563EB",
                        colorlessdark: "#eccf3e"
                    }
                },
            }
        };
    </script>

</head>
<body class="bg-gray-300 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
<header class="bg-colorless dark:bg-colorlessdark shadow-lg p-4">
    <div class="flex justify-between items-center max-w-7xl mx-auto">
        <h1 class="text-2xl font-bold text-white dark:text-black font-display">pixelia</h1>

        <nav class="hidden md:flex flex-col md:flex-row md:space-x-6 text-sm font-medium text-white dark:text-black" id="nav-menu">
            <a href="index.html" class="block py-2 hover:text-indigo-600">Accueil</a>
            <a href="galerie.html" class="block py-2 hover:text-indigo-600">galerie</a>
            <a href="contact.html" class="block py-2 hover:text-indigo-600">contact</a>
        </nav>

        <button class="bg-gray-200 dark:bg-gray-700 text-black dark:text-white px-4 py-2 rounded" id="theme">
            🌗 Basculer thème
        </button>
        <button id="burger" class="md:hidden text-indigo-600 text-3xl focus:outline-none">
            &#9776;
        </button>
    </div>
</header>

<h2 class="text-center text-2xl font-bold my-16 darl:text-white">contactez-nous</h2>

<form class="max-w-xl mx-auto bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg shadow-md p-8">
    <div class=" mb-4 block text-sm font-medium">
        <label for="prenom">Prénom</label>
        <input type="text" id="prenom" name="prenom" required class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-900 dark:text-white rounded-md px-3 py-2">
    </div>

    <div class=" mb-4 lock text-sm font-medium">
        <label for="nom">nom</label>
        <input type="text" id="nom" name="nom" required class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-900 dark:text-white rounded-md px-3 py-2">
    </div>

    <div class="mb-4 block text-sm font-medium">
        <label for="email">email</label>
        <input type="email" id="email" name="email" required class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-900 dark:text-white rounded-md px-3 py-2">
    </div>
    <div>
        <label for="sujet" class=" block text-sm font-medium">Sujet</label>
        <select name="sujet" id="sujet" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-900 dark:text-white rounded-md px-3 py-2 mb-4">
            <option value="jeu-prefere">jeu préféré</option>
            <option value="partenariat">partenariat</option>
            <option value="bug">signaler un probleme</option>
        </select>
    </div>

    <div>
        <label for="message" class=" block text-sm font-medium">message</label>
        <textarea id="message" name="message" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-900 dark:text-white rounded-md px-3 py-8"></textarea>
    </div>

    <button type="submit" class="bg-yellow-400 rounded-md dark:bg-orange-500 py-2 px-2">Envoyer</button>

</form>

<footer class="text-center my-16">
    <p>Merci de soutenir Pixelia-la passion du retro!</p>
</footer>

</body>
</html>
